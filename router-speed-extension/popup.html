<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Router Monitor</title>

  <link
    rel="stylesheet"
    href="popup.css"
  >
</head>

<body>

  <div class="popup-container">

    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <div class="top-bar">

      <div
        id="titleSpeed"
        class="title-speed"
      >
        ↑ 0 KB | ↓ 0 KB | -- dBm
      </div>

      <button
        id="refreshBtn"
        class="refresh-btn"
        type="button"
        title="Refresh"
      >
        ↻
      </button>

    </div>


    <!-- =====================================================
         REFRESH STATUS
         ===================================================== -->

    <div
      id="refreshStatus"
      class="refresh-status"
    >
      Connecting...
    </div>


    <!-- =====================================================
         WIFI VISIBILITY
         ===================================================== -->

    <div class="wifi-card">

      <div class="wifi-header">

        <div>

          <div class="wifi-title">
            Wi-Fi Visibility
          </div>

          <div
            id="wifiStatus"
            class="wifi-status"
          >
            Checking...
          </div>

        </div>

        <div class="wifi-icon">
          Wi-Fi
        </div>

      </div>


      <!-- ===================================================
           SINGLE TOGGLE BUTTON

           Visible:
             Button = Hide Wi-Fi

           Hidden:
             Button = Show Wi-Fi
           =================================================== -->

      <button
        id="wifiToggleBtn"
        class="wifi-toggle-btn"
        type="button"
      >
        Checking...
      </button>

    </div>

  </div>


  <!-- =======================================================
       POPUP JAVASCRIPT
       ======================================================= -->

  <script src="popup.js"></script>

</body>

</html>
