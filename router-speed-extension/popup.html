<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Router Monitor</title>

  <link
    rel="stylesheet"
    href="popup.css"
  >
</head>

<body>

  <div class="popup-container">

    <!-- =====================================================
         SPEED / SIGNAL
         ===================================================== -->

    <div class="speed-container">

      <!-- UPLOAD -->

      <div class="speed-item">

        <div class="speed-value upload-value">
          ↑
          <span id="uploadSpeed">0</span>
          KB
        </div>

        <div class="speed-label">
          Upload
        </div>

      </div>


      <!-- DOWNLOAD -->

      <div class="speed-item">

        <div class="speed-value download-value">
          ↓
          <span id="downloadSpeed">0</span>
          KB
        </div>

        <div class="speed-label">
          Download
        </div>

      </div>


      <!-- SIGNAL -->

      <div
        class="speed-item signal"
        id="signalCard"
      >

        <div class="speed-value">

          <span id="signalValue">--</span>
          dBm

        </div>

        <div class="speed-label">
          Signal
        </div>

      </div>

    </div>


    <!-- =====================================================
         ALL CONTROLS - ONE ROW
         ===================================================== -->

    <div class="controls-row">

      <!-- WIFI VISIBILITY -->

      <button
        id="wifiToggleBtn"
        class="control-btn wifi-control-btn"
        type="button"
      >
        Checking...
      </button>


      <!-- 500ms -->

      <button
        id="refresh500Btn"
        class="control-btn refresh-speed-btn"
        type="button"
      >
        500ms
      </button>


      <!-- 1000ms -->

      <button
        id="refresh1000Btn"
        class="control-btn refresh-speed-btn active"
        type="button"
      >
        1000ms
      </button>


      <!-- REFRESH -->

      <button
        id="refreshBtn"
        class="control-btn refresh-btn"
        type="button"
        title="Refresh now"
      >
        ↻
      </button>

    </div>


    <!-- =====================================================
         CONNECTION STATUS
         ===================================================== -->

    <div
      id="refreshStatus"
      class="refresh-status"
    >
      Connecting...
    </div>


    <!-- =====================================================
         WIFI STATUS
         ===================================================== -->

    <div class="wifi-status-row">

      <span class="wifi-title">
        Wi-Fi:
      </span>

      <span
        id="wifiStatus"
        class="wifi-status"
      >
        Checking...
      </span>

    </div>

  </div>


  <script src="popup.js"></script>

</body>

</html>
