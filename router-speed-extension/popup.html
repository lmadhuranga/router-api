<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Internet Speed</title>

  <link
    rel="stylesheet"
    href="popup.css"
  >
</head>

<body>

  <div class="container">

    <!-- =====================================================
         HEADER
         ====================================================== -->

    <div class="header">

      <div class="header-content">

        <h1>
          Internet Speed
        </h1>

        <div
          id="speedTitle"
          class="speed-title"
        >
          ↑ 0 KB | ↓ 0 KB | -- dBm
        </div>

      </div>


      <button
        id="refreshButton"
        class="refresh-button"
        title="Refresh now"
        type="button"
      >
        ↻
      </button>

    </div>


    <!-- =====================================================
         STATUS
         ====================================================== -->

    <div
      id="status"
      class="status"
    >
      Connecting to router...
    </div>


    <!-- =====================================================
         TITLE FORMAT
         ====================================================== -->

    <div class="card">

      <div class="card-title">
        Title Format
      </div>


      <select
        id="titleFormat"
      >

        <!-- DEFAULT -->
        <option value="KB">
          ↑ 13 KB | ↓ 191 KB | 105 dBm
        </option>


        <!-- KB/s -->
        <option value="KB/s">
          ↑ 13 KB/s | ↓ 191 KB/s | 105 dBm
        </option>


        <!-- PLAIN -->
        <option value="plain">
          ↑ 13 | ↓ 191 | 105 dBm
        </option>

      </select>

    </div>


    <!-- =====================================================
         FOOTER
         ====================================================== -->

    <div class="footer">

      Auto refresh:
      <strong>
        2 seconds
      </strong>

    </div>

  </div>


  <script src="popup.js"></script>

</body>

</html>
